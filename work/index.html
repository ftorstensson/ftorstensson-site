<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selected work · Fred Torstensson</title>
<meta name="description" content="Case studies by Fred Torstensson, product designer: Tourism Fiji, IKEA, Parliament of NSW, RSL Queensland Lottery, the Australian Federal Police and UNSW.">
<link rel="icon" href="../favicon.ico" sizes="32x32"><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inder&family=Grenze:wght@700&display=swap">
<style>
:root{--ink:#23221F;--cream:#E7E7D6;--paper:#fbfaf3}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);font-family:Inder,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
/* board; the dot grid never gets denser than it is at reading size */
.vp{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.vp.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}  /* no will-change: text stays sharp when you zoom in */
.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.links path{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round;opacity:.35;transition:opacity .2s,stroke-width .2s}
.links path.on{opacity:1;stroke-width:3;stroke-dasharray:none}
/* a case board: one document in the middle, its pictures pinned around it */
.case{position:absolute;box-sizing:border-box;border-radius:36px;background:rgba(251,250,243,.5);outline:2px solid rgba(35,34,31,.08)}
.case>.tagline{position:absolute;left:60px;top:44px;margin:0;font-size:22px;letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.doc{position:absolute;box-sizing:border-box;width:1060px;padding:96px 110px 110px;background:var(--paper);border-radius:10px;box-shadow:0 1px 0 rgba(35,34,31,.08),0 20px 60px rgba(35,34,31,.13)}
.doc .accent{width:90px;height:8px;border-radius:4px;margin-bottom:34px}
.doc h2{margin:0 0 22px;font:700 54px/1.12 Inder,system-ui,sans-serif;letter-spacing:-.015em}
.doc .kick{margin:0 0 70px;font-size:21px;line-height:1.5;opacity:.65}
.doc section{position:relative;margin:0 0 64px}
.doc section:last-child{margin-bottom:0}
.doc h3{margin:0 0 16px;font:700 32px/1.15 Inder,system-ui,sans-serif;letter-spacing:-.01em}
.doc p{margin:0;font-size:24px;line-height:1.6}
.doc p+p{margin-top:18px}
.doc .lnk{position:relative;cursor:pointer}
.doc .lnk::before{content:"";position:absolute;left:-30px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--ink);opacity:.8}
.doc .lnk.r::before{left:auto;right:-30px}
.doc ul{list-style:none;margin:22px 0 0;padding:0}
.doc li{position:relative;padding:10px 0;font-size:22px;line-height:1.5;cursor:pointer}
.doc li b{font:700 24px/1.3 Inder,system-ui,sans-serif}
.doc .notes{margin:0;padding:28px 0 0 22px;border-top:2px solid rgba(35,34,31,.12);font-size:17px;line-height:1.5;opacity:.7}
.doc .notes li{padding:3px 0;font-size:17px;cursor:default}
.doc sup{font-size:.6em;line-height:0}
/* pictures: placeholders for now */
.ev{position:absolute;width:380px;margin:0;cursor:pointer;transition:transform .25s,opacity .2s}
.ev .img{height:260px;border-radius:10px;background:#cfccbf repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.18) 22px 44px);display:grid;place-items:center;color:rgba(35,34,31,.5);font-size:20px;transition:box-shadow .2s}
.ev figcaption{margin-top:12px;font:700 20px/1.3 Inder,system-ui,sans-serif}
.ev:hover,.ev.on{transform:scale(1.04)!important}
.ev.on .img{box-shadow:0 0 0 4px var(--ink)}
.case.dim .ev:not(.on){opacity:.45}
.soon .doc{background:transparent;box-shadow:none;border:3px dashed rgba(35,34,31,.25);opacity:.6}
/* chrome */
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:99px;background:var(--ink);color:var(--cream);box-shadow:0 10px 30px rgba(35,34,31,.3);z-index:5;max-width:calc(100vw - 24px)}
.bar button{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font-size:20px}
.bar button:hover{background:rgba(231,231,214,.12)}
.bar button:disabled{opacity:.3;cursor:default}
.bar .where{min-width:0;padding:0 8px;text-align:center;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .where small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
.bar .dots{display:flex;gap:5px;padding:0 6px}
.bar .dots i{width:6px;height:6px;border-radius:50%;background:var(--cream);opacity:.3}
.bar .dots i.on{opacity:1}
.hint{position:fixed;left:22px;bottom:24px;font-size:13px;opacity:.55;z-index:4}
@media (max-width:700px){.hint{display:none}.bar .dots{display:none}}

/* the first page: the work board from the postcard preview */
.index{position:fixed;inset:0;background:var(--cream)}
.ivp{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.ivp.drag{cursor:grabbing}
.iworld{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.iworld .card{position:absolute;box-sizing:border-box;width:560px;padding:34px 38px 36px;background:var(--paper);border-radius:16px;box-shadow:0 1px 0 rgba(35,34,31,.08),0 14px 40px rgba(35,34,31,.12);cursor:pointer;transition:box-shadow .25s}
.iworld .card:not(.title):not(.note):not(.soon):hover,.iworld .card:focus-visible{box-shadow:0 1px 0 rgba(35,34,31,.08),0 22px 54px rgba(35,34,31,.22);outline:none}
.iworld .card h2{margin:0 0 12px;font:700 40px/1.05 Grenze,serif}
.iworld .card p{margin:0;font-size:19px;line-height:1.45;opacity:.8}
.iworld .card .res{margin-top:18px;opacity:1}
.iworld .card .tag{display:inline-block;margin:0 0 16px;padding:5px 11px;border-radius:99px;font-size:12px;line-height:1;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--cream)}
.iworld .card.soon .tag{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(35,34,31,.4)}
.iworld .card.soon h2,.iworld .card.soon p{opacity:.5}
.iworld .card.title{width:760px;background:none;box-shadow:none;cursor:default;padding:0}
.iworld .card.title h1{margin:0 0 14px;font:700 96px/1 Grenze,serif}
.iworld .card.title p{font-size:24px}
.iworld .card.note{width:240px;height:240px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#F4E35A;border-radius:3px;transform:rotate(2deg);padding:14px;cursor:default;box-shadow:0 2px 4px rgba(35,34,31,.08),0 12px 26px rgba(35,34,31,.14)}
.iworld .card.note p{margin:0;font-weight:700;font-size:40px;line-height:1.08;color:var(--ink)}.iworld .card.note p+p{margin-top:14px}
.iworld .card.note a{color:var(--ink);text-underline-offset:5px;text-decoration-thickness:3px;white-space:nowrap;cursor:pointer}
.phone .iworld .card{width:600px}
.phone .iworld .card h2{font-size:40px}.phone .iworld .card p{font-size:27px}.phone .iworld .card .tag{font-size:16px;padding:7px 14px}
.phone .iworld .card.title{width:640px}.phone .iworld .card.title p{font-size:30px}
.phone .iworld .card.note{width:260px;height:260px}
.ctl{position:absolute;right:18px;bottom:18px;display:flex;gap:6px}
.iworld .card:not(.title):not(.note){padding:0;overflow:hidden}
.iworld .card .ctop{height:200px;display:flex;align-items:center;justify-content:center}
.iworld .card .clogo{display:block;object-fit:contain}
.lphotos{position:absolute;width:600px}
.lphotos .pc{margin:0 0 50px;width:500px;aspect-ratio:3/2;overflow:hidden;border-radius:1px;box-shadow:0 2px 4px rgba(35,34,31,.12),0 14px 34px rgba(35,34,31,.16)}
.lphotos .qc{margin:70px 0 50px;width:520px;color:var(--ink)}  /* the quote sits straight on the board, no card */
.lphotos .qc blockquote{margin:0 0 18px;font-weight:700;font-size:25px;line-height:1.38}
.lphotos .qc figcaption{font-size:15px;opacity:.7}
.lphotos .pc img{display:block;width:100%;height:100%;object-fit:cover}  /* 6×4 prints, the old film-lab size */
.iworld .card .ctop.photo{height:250px;display:block}
.iworld .card .ctop.photo img{display:block;width:100%;height:100%;object-fit:cover}
.phone .iworld .card .ctop.photo{height:290px}
.iworld .card .cbody{padding:28px 36px 34px}
.iworld .card h2.cname{margin:0 0 10px;font:700 28px/1.15 Inder,system-ui,sans-serif;letter-spacing:-.01em}
.phone .iworld .card .ctop{height:240px}.phone .iworld .card .clogo{transform:scale(1.25)}
.phone .iworld .card h2.cname{font-size:40px}
.doc .listen{position:absolute;top:40px;right:44px;display:flex;align-items:center;gap:8px;padding:9px 16px 9px 12px;border:2px solid var(--ink);border-radius:99px;background:none;color:var(--ink);font:700 17px Inder,sans-serif;cursor:pointer}
.doc .listen svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.doc .listen .sp{fill:currentColor}.doc .listen .st{display:none;fill:currentColor;stroke:none}
.doc .listen.on{background:var(--ink);color:var(--paper)}.doc .listen.on .sp,.doc .listen.on .w1,.doc .listen.on .w2{display:none}.doc .listen.on .st{display:block}
.doc .listen:hover{background:rgba(35,34,31,.06)}.doc .listen.on:hover{background:var(--ink)}
.tour{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(760px,calc(100vw - 24px));box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;background:var(--ink);color:var(--cream);box-shadow:0 10px 30px rgba(35,34,31,.3);z-index:6}
.tour[hidden]{display:none}
.tour button{all:unset;cursor:pointer;flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.tour .tplay{background:var(--cream);color:var(--ink)}
.tour svg{width:22px;height:22px;fill:currentColor}
.tour .pl{display:none}.tour.paused .pl{display:block}.tour.paused .pa{display:none}
.tour .tx{font-size:26px;opacity:.7}.tour .tx:hover{opacity:1;background:rgba(231,231,214,.12)}
.tour .tmain{flex:1;min-width:0}
.tour .tcap{margin:0 0 10px;font-size:17px;line-height:1.35;min-height:2.7em}
.tour .tsegs{display:flex;gap:4px;height:14px;align-items:center;cursor:pointer}
.tour .tsegs i{position:relative;height:5px;border-radius:3px;background:rgba(231,231,214,.25);overflow:hidden}
.tour .tsegs i:hover{height:8px}
.tour .tsegs b{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--cream)}
.tour .ttime{flex:none;font-size:13px;opacity:.7;font-variant-numeric:tabular-nums}
@media (max-width:700px){.tour{gap:8px;padding:10px 10px 12px}.tour .ttime{display:none}.tour .tcap{font-size:14px;margin-bottom:8px}.tour button{width:40px;height:40px}}
.bar .play[hidden]{display:none!important}
.bar .play svg{width:20px;height:20px;fill:currentColor}
.doc .listen svg .pl{fill:currentColor;stroke:none}.doc .listen .pa{display:none}
.reading{background:rgba(244,227,90,.38);box-shadow:0 0 0 6px rgba(244,227,90,.38);border-radius:3px}
.doc .reading{background:rgba(244,227,90,.38);box-shadow:0 0 0 6px rgba(244,227,90,.38);border-radius:3px;transition:background .3s}
.doc blockquote.pull{margin:46px 0 8px;padding:6px 0 6px 30px;border-left:6px solid var(--acc,#EA7F60)}
.doc blockquote.pull p{margin:0 0 14px;font-weight:700;font-size:27px;line-height:1.4}
.doc blockquote.pull cite{font-style:normal;font-size:17px;opacity:.7}
.doc .dlz{height:120px;display:flex;align-items:center;margin:0 0 26px}.doc .dlogo{display:block;object-fit:contain}
.ctl button{all:unset;cursor:pointer;min-width:38px;height:38px;padding:0 10px;box-sizing:border-box;display:grid;place-items:center;border-radius:10px;background:var(--ink);color:var(--cream);font-size:15px}
.ctl button:hover{background:#3a3833}
/* the card grows into the board */
.zoomer{position:fixed;z-index:20;background:var(--paper);border-radius:16px;pointer-events:none}
.boardview{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity .35s}
.boardview.show{opacity:1;visibility:visible}
.back{all:unset;position:fixed;top:16px;left:16px;z-index:6;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 16px 10px 13px;border-radius:99px;background:var(--ink);color:var(--cream);font-size:15px;box-shadow:0 6px 20px rgba(35,34,31,.25)}
.back:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* phones: a narrower document so every stop reads at full width */
.phone .doc{width:600px;padding:64px 40px 70px}
.phone .doc h2{font-size:42px}
.phone .doc .lnk::before{left:-24px}.phone .doc .lnk.r::before{right:-24px}

/* test, Fiji only: the case is paper on off-white, no board behind it */
.sidecase .vp{background-image:none!important;background-color:var(--casebg,#F4F2EA)}
.sidecase .case{background:none;outline:none}
.sidecase .case>.tagline{display:none}
.sidecase .doc{padding-bottom:220px;background:#FFFEFB;box-shadow:0 1px 0 rgba(35,34,31,.06),0 24px 70px rgba(35,34,31,.10)}
.rolecol{position:absolute;width:640px}
.phone.sidecase .doc{padding-bottom:80px}
.rnote{position:absolute;right:125px;top:-305px;box-sizing:border-box;width:230px;height:230px;display:flex;flex-direction:column;justify-content:center;padding:24px;background:#F4E35A;border-radius:3px;transform:rotate(2.5deg);box-shadow:0 2px 4px rgba(35,34,31,.12),0 10px 24px rgba(35,34,31,.14);font-size:19px;line-height:1.4;font-weight:700}
.rsticker{position:absolute;left:40px;box-sizing:border-box;width:250px;height:250px;display:flex;flex-direction:column;justify-content:center;padding:24px;background:#BDE7A6;border-radius:3px;transform:rotate(-2deg);box-shadow:0 2px 4px rgba(35,34,31,.12),0 10px 24px rgba(35,34,31,.14);font-size:19px;line-height:1.45}
.rsticker p{margin:0;font-weight:700}.rsticker p+p{margin-top:8px}
.rnote span{font-weight:700}
.rnote,.rsticker{text-align:center;font-size:var(--nfs,46px);line-height:1.08;padding:16px;align-items:center}  /* big, centred post-it type */
.rsticker p+p{margin-top:14px}
.rsticker a{color:var(--ink);text-underline-offset:5px;text-decoration-thickness:3px;white-space:nowrap}
.rnote span{display:block}
.rnote .rarrow{display:block;width:70px;height:56px;margin:8px auto 0;fill:none;stroke:#23221F;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.phone .rnote{position:relative;top:auto;right:auto;margin:0 0 40px auto;width:300px;height:300px;font-size:24px}
.phone .rsticker{position:relative;left:auto;margin:60px 0 0 20px;width:330px;height:330px;font-size:24px}
.phone.sidecase .rnote,.phone.sidecase .rsticker{position:absolute;margin:0;width:260px;height:260px}
.phone.sidecase .rsticker{width:280px;height:280px}
.phone.sidecase .rnote,.phone.sidecase .rsticker{font-size:48px}
.rolecol h3{margin:0 0 14px;font:700 70px/1.05 Grenze,serif}
.phone .rolecol h3{margin-top:0;font-size:52px}
.rolecol>p.rintro{margin:0 0 30px;font-size:21px;line-height:1.5;opacity:.8}
.tile{all:unset;box-sizing:border-box;display:grid;grid-template-columns:150px 1fr;grid-template-rows:auto 1fr;column-gap:22px;width:100%;margin:0 0 18px;padding:18px;background:#FFFEFB;border-radius:14px;box-shadow:0 1px 0 rgba(35,34,31,.06),0 12px 34px rgba(35,34,31,.09);cursor:pointer;transition:transform .2s,box-shadow .2s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:0 1px 0 rgba(35,34,31,.06),0 18px 44px rgba(35,34,31,.16)}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.tile .img{grid-row:1/3;height:112px;border-radius:9px;background:#d9d6ca repeating-linear-gradient(135deg,transparent 0 16px,rgba(255,255,255,.22) 16px 32px);display:grid;place-items:center;font-size:15px;color:rgba(35,34,31,.45)}
.tile b{font:700 24px/1.2 Inder,system-ui,sans-serif;margin:2px 0 6px}
.tile span{font-size:17px;line-height:1.45;opacity:.75}
.phone .rolecol{width:600px}
.acc{border-top:2px solid rgba(35,34,31,.14)}
.acc:last-child{border-bottom:2px solid rgba(35,34,31,.14)}
.ahead{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:22px 0 6px;cursor:pointer}
.ahead:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.ahead .at{font:700 27px/1.2 Inder,system-ui,sans-serif}
.ahead .chev{flex:none;width:11px;height:11px;margin-right:4px;border-right:3.6px solid currentColor;border-bottom:3.6px solid currentColor;border-radius:0 0 1.5px 0;transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s}  /* sized and weighted like the bold 27px title */
.acc.open .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.acc .atext{margin:0 40px 20px 0;font-size:19px;line-height:1.5;opacity:.75}
.acc .abody{display:none;padding:4px 0 30px}
.acc.open .abody{display:block}
.acc.flat .ahead{cursor:default;pointer-events:none}
.mini{position:relative;padding:18px;border-radius:12px;background:#F4F2EA;box-shadow:inset 0 0 0 1.5px rgba(35,34,31,.08)}
.mwrap{position:relative;width:560px;margin:0 auto}
.phone .mwrap{width:560px;margin:0}
.rb{position:relative;margin:0 auto;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 2px 10px rgba(35,34,31,.12)}
.rn{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;overflow:hidden;font-family:Inder,system-ui,sans-serif}
.rn span{display:block;padding:0 6%}
.rg{border-radius:.6px;box-shadow:0 .4px .8px rgba(0,0,0,.18)}
.rz{border-radius:2px}
.rt{justify-content:flex-start;text-align:left;align-items:flex-start;font-weight:700;white-space:nowrap;overflow:visible}
.bcap{margin:0 0 12px;font-size:15px;opacity:.6}
.bwall{width:640px;margin:0;padding:8px 0 4px}
.mini:has(.bwall){padding:0;background:none;box-shadow:none;border-radius:0}  /* an invisible box: the boards run out to the lines */
.phone .bwall{width:600px}  /* centred in the thin-lined box, like the other rows */
.brow{margin:14px 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.5}
.brow:first-child{margin-top:0}
.bline{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.bc{margin:0}
.loadline{position:absolute;left:50%;top:50%;width:160px;height:4px;margin-left:-80px;border-radius:2px;background:rgba(35,34,31,.12);overflow:hidden}.loadline b{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.bc img,.lphotos .pc{transition:opacity .25s}.bc img:not(.ld),.lphotos .pc:not(.ld){opacity:0}

.bnote{margin:16px 0 0;font-size:14px;opacity:.55}
.blink{margin:18px 0 0;font-size:17px;font-weight:700}.blink a{color:var(--ink);text-underline-offset:4px}
.miro{margin:0}.miro img{display:block;width:100%;border-radius:6px;box-shadow:0 2px 10px rgba(35,34,31,.12)}.miro figcaption{margin-top:8px;font-size:14px;opacity:.6}
.mc{position:absolute;margin:0;padding:6px 6px 0;background:#FFFEFB;border-radius:4px;box-shadow:0 2px 6px rgba(35,34,31,.14)}

.phase{position:fixed;z-index:30;inset:4vh 4vw;overflow:auto;background:#FFFEFB;border-radius:18px;box-shadow:0 30px 90px rgba(35,34,31,.28);padding:44px 52px}
.phase .pclose{all:unset;position:absolute;top:16px;right:18px;width:42px;height:42px;display:grid;place-items:center;border-radius:99px;background:var(--ink);color:var(--cream);font-size:24px;cursor:pointer}
.phase .ptag{margin:0;font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.phase h2{margin:6px 0 10px;font:700 44px/1.1 Inder,system-ui,sans-serif}

/* FredBot, the guide */
.bot{position:fixed;z-index:35;left:18px;top:70vh;width:78px;opacity:0;pointer-events:none;transition:left .9s cubic-bezier(.45,0,.2,1),top .9s cubic-bezier(.45,0,.2,1),opacity .3s}
.bot.on{opacity:1}
.bot .head{position:relative;display:block;width:78px;height:auto;filter:drop-shadow(0 6px 10px rgba(35,34,31,.25))}
.bot .wings{position:absolute;left:-46px;top:40px;width:170px;fill:#fff;stroke:#23221F;stroke-width:3;stroke-linejoin:round;z-index:-1}
.bot .wl{transform-origin:96px 54px}.bot .wr{transform-origin:104px 54px}
.bot .wl,.bot .wr{animation:flap 1.6s ease-in-out infinite}
.bot.flying .wl,.bot.flying .wr{animation-duration:.22s}
.bot .wr{animation-name:flapR}
@keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
@keyframes flapR{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.bot{animation:hover 2.4s ease-in-out infinite}
@keyframes hover{0%,100%{translate:0 0}50%{translate:0 -6px}}
.bot .say{position:absolute;right:92px;top:6px;width:max-content;max-width:260px;padding:10px 14px;border-radius:14px 14px 4px 14px;background:var(--ink);color:var(--cream);font-size:15px;line-height:1.35;opacity:0;transform:translateY(4px);transition:opacity .25s .5s,transform .25s .5s}
.bot .say.show{opacity:1;transform:none}
.bot.flip .say{right:auto;left:92px;border-radius:14px 14px 14px 4px}
@media (max-width:700px){.bot,.bot .head{width:54px}.bot .wings{left:-32px;top:28px;width:118px}.bot.flip .say{left:64px;max-width:calc(100vw - 92px);font-size:14px}}
@media (prefers-reduced-motion:reduce){.bot,.bot .wl,.bot .wr{animation:none}.bot{transition:opacity .2s}}

<script>(()=>{

/* ---------- content: Fiji is real (Fred's text, not yet redacted), the rest are placeholders ---------- */
const CASES=[
 {id:'fiji',side:true,logo:'logos/fiji.webp',name:'Tourism Fiji',accent:'#79D1C5',photo:'cards/fiji.jpg',photos:[['photos/fiji-snorkel.jpg','Snorkelling in Fiji'],['photos/fiji-dancers.jpg','Fijian dancers on the beach'],['photos/fiji-cliff.jpg','Cliff jumping in Fiji']],
  title:'Tourism Fiji: a national tourism site, built to be found',
  kick:'For Tourism Fiji, at Host/Havas · UX lead · Design and build scope, Dec 2022 to Jul 2023',
  problem:['International tourism is a nearly $2 trillion a year industry (UN Tourism, 2025), and every country, region and city is chasing its share. It’s especially true for Fiji, where tourism drives about 40% of the economy and the Tourism Fiji site is an important part of how it competes.',
   'Then come two twists. First, Fiji is two destinations: the close, easy holiday Australians and New Zealanders come back to again and again, often to the same resort, and the exotic wedding or honeymoon for Americans and Europeans. The site has to cater equally to both. Second, Fiji’s government wants the tourist dollars spread into the wider society. Most visitors stay at their resort, so the site also has to get them out to dive, golf, hike or eat local, booked with small businesses.'],
  problemPic:'The two Fijis',
  solution:['Travellers tell Google what they want: “honeymoon in Fiji”, “what to do in Fiji for free”. So my starting insight was that Google is the homepage, and every page on the site is a landing page.',
   'Each page had to answer the question the traveller typed into Google. Then the next click had to go deeper into the site, not off to another tourist site. Keeping people on the site also changes the question they’re asking. Instead of “Fiji, Tahiti or Hawaii?”, it becomes “where on Fiji?” And once the trip is booked, the site is there to fill the week or two with more to do on the island, booked with small businesses.'],
  solutionPic:'Google is the homepage',
  roleIntro:'I was responsible for the experience end to end, from the first interview to launch.',
  role:[
   ['Stakeholder interviews','at Tourism Fiji and with tourism operators.','Interview notes'],
   ['Audit and landscape review:','the old site’s content and structure, and six competitor and tourism sites.','Audit and competitor map'],
   ['Personas and the user journey:','who the site is for, built from desk research and data, and what each audience looks for at each stage of the funnel.','Personas and journey'],
   ['Information architecture:','flat, mobile-first and built around search, with categories instead of regions at the top. I worked with a third-party SEO company so the new site kept the search rankings the old one had earned.','Sitemap'],
   ['All the wireframes and the build scope,','including the dynamic content logic: showing the right content to the right person, so every audience finds something for them in the right place in the hierarchy.','Wireframes'],
   ['Experience director','on the UI and the build, which others did. After July, I kept reviewing and giving notes through to launch, to keep the vision and the quality intact.','Final UI']],
  out:[['+18%','bookings'],['+25%','engagement']],
  outText:['After launch, Tourism Fiji measured the results on its own site: bookings up 18%, engagement up 25%.','Bookings are the number that counts. A new site that brought in more visitors but no more business would have been worse than the old one. This one brought in more business.']},
 {id:'ikea',side:true,photo:'cards/ikea.jpg',photos:[['photos/ikea-store.jpg','An IKEA store'],['photos/ikea-tag.jpg','A price tag in store'],['photos/ikea-warehouse.jpg','The self-serve warehouse']],logo:'logos/ikea.svg',name:'IKEA Australia',accent:'#0058A3',
  short:'Shorter pages, built for four kinds of shopper.',who:'Host/Havas · UX Director · 2024–25',res:'Best test: conversion up 22%, revenue per visitor up 44%',
  title:'IKEA Australia: shorter pages, built for four kinds of shopper',
  kick:'For IKEA Australia, at Host/Havas · UX Director · UX discovery and page recommendations · Oct 2024 to Jan 2025',
  sections:[
   {id:'problem',h:'Problem',pic:'White on white, on a phone',p:['Australians spent a record $69 billion online in 2024.<sup>1</sup> IKEA wanted a bigger share, and shoppers were on their phones: in furniture and homewares, three in four visits come from mobile.<sup>2</sup> So the brief was clear: more add-to-carts on mobile. But on a phone, people look less and leave sooner.<sup>2</sup> Most visitors looked at a few pages and left. A small group of returning shoppers brought in most of the revenue. And most first purchases still happened in a store: people wanted to see the quality first. The site didn’t help on a small screen. It was beautiful and factual, but white products on white backgrounds looked sterile on a phone. So every page had to catch people fast and give them a reason to stay.']},
   {id:'solution',h:'Solution',pic:'Four personality types',p:['The idea: design for personality types, not personas. On a shop site, people pick themselves. So we used IKEA’s own four types: the Achiever, the Creator, the Socialiser and the Explorer. The Socialiser, for one, looks to what other people do, so social proof matters. Every page became a short story for all four. The first screen is prime real estate. So each component got an attractiveness score: of the people who scrolled to it, how many used it. High scorers moved up. Copy went from matter-of-fact to direct, pictures from white on white to lifestyle. It’s the same IKEA. You change things around, make pages shorter, move up what people like to use, and you’re off to the races.']},
   {id:'role',h:'My role',intro:'I led the UX discovery, from the first documentation review to the page definitions.',items:[
    ['Documentation review:','what IKEA already knew, from its research and earlier tests.','What IKEA already knew'],
    ['Landscape analysis:','four competitors across six page types, on mobile. Most spoke in a more direct, actionable voice than IKEA.','Competitors on mobile'],
    ['Data analysis:','a data scientist colleague ran the numbers, and together we found the pages that needed help most.','Pages that needed help'],
    ['Heuristic review:','15 key pages, scored through the eyes of each personality type, using an adapted UX Honeycomb.','Adapted UX Honeycomb'],
    ['Recommendations and five page definitions:','components reordered by attractiveness score, copy rewritten, images swapped. One of them was the sleep guide.','The sleep guide, before and after'],
    ['Component and content guidelines,','so IKEA’s own team could keep going.','Guidelines']]},
   {id:'out',h:'Outcome',p:['IKEA then A/B tested the recommendations. Of seven tests, five won and two were inconclusive. The best was the sleep guide I redesigned: conversion up 22%, revenue per visitor up 44%. That’s the number that counts. The brief was more sales from mobile, and every visitor was now worth more. My job was the discovery and the design. The testing was IKEA’s. IKEA was very pleased, and has built the learnings into the site.']}],
  notes:['Australia Post, eCommerce Industry Report 2025: Australians spent $69 billion on goods online in 2024, up 12% on 2023.',
   'Similarweb, “Australian Furniture and Homewares: Mobile-First and Primed for Growth”, October 2024: mobile makes up 75% of traffic in the category, and desktop visitors stay longer and view more pages.']},
 {id:'nsw',side:true,logo:'logos/nsw.webp',name:'Parliament of NSW',accent:'#EA7F60',photo:'cards/nsw.jpg',photos:[['photos/nsw-house.jpg','Parliament House, Macquarie Street'],['photos/nsw-tour.jpg','The Parliament tour'],['quote','The team at Host Havas demonstrated exceptional insight into the intricate nature of the Parliament of NSW. … They undertook an approach that was collaborative; taking stakeholders and users though the process of requirements gathering and research which produced a flexible and customisable design system and component-based solution that is user friendly and intuitive for all users.','Parliament of NSW, on the website user experience and user interface design']],
  short:'A hub for living democracy.',who:'Host/Havas · UX Director · 2022',res:'Tree tests: 87% public, 89% staff',
  title:'Parliament of NSW: building a hub for living democracy',
  kick:'For the Parliament of NSW, at Host/Havas · UX Director · Research, information architecture, UX concept and testing · About half a year in 2022, plus the records restructure',
  sections:[
   {id:'problem',h:'Problem',pic:'Two houses, many audiences',p:['In 2020, Parliament’s strategy said it plainly: people don’t know enough about their Parliament.<sup>1</sup> The latest national civics test agreed. Only 38% of Year 10 students reached the standard.<sup>2</sup> The site didn’t help. It looked dated, was hard to navigate and, worst of all, wasn’t mobile first. It was too poor to be the window to Parliament it had to be. Parliament has committed to being open and easy to understand.<sup>3</sup> If people can’t find its work, that promise falls short. Its public lives in one of the most culturally diverse states in the world,<sup>4</sup> where democracy and accessibility matter more than ever. But the site is also Parliament’s work tool. Roughly, both houses add well over 10,000 documents a year,<sup>5</sup> to records going back to 1824. Staff need the right one, fast. And there are two houses. Both had to be represented equally, and neither could look more important than the other.']},
   {id:'solution',h:'Solution',pic:'Parliament for New South Wales',p:['The idea: Parliament <b>for</b> New South Wales. A hub for living democracy, for everyone across the state, from the Queensland border to the middle of Sydney. Wherever you are, wherever you’re from, whatever your education. Democracy is for everybody, so the site had to be accessible to everybody. Under that idea, three things had to be right. Both houses side by side, as equals. Mobile first, because most web traffic is now mobile.<sup>6</sup> And a really good work tool, so Parliament finds the exact document it needs, when it needs it.']},
   {id:'role',h:'My role',intro:'I was in charge of the experience, from the first workshops to the final design concept.',items:[
    ['Research:','stakeholder interviews and workshops with both houses, user interviews, personas and journeys.','Workshops and personas'],
    ['Audit and landscape review:','the old site, its data, and how others solve the same problems.','Audit'],
    ['Information architecture:','a card sort and two Treejack tests for the site.','Card sort and tree tests'],
    ['UX concept and wireframes,','including finding the documents Parliament adds every week. I prototyped and tested the heaviest parts.','Wireframes and prototype'],
    ['Experience direction:','with really good people, the best direction is no direction, just a bit of nudging. Our UI designer made the UI concepts, and a colleague did the content audit and strategy. Together, we made sure the UX and UI fit the experience and the brand.','UI concepts']]},
   {id:'ia',h:'Information architecture deluxe',pic:'The document map',p:['As part of this project, I took on all of Parliament’s documents: everything produced by both houses and all the committees. It’s a very intricate system, and sorting it out was extremely complicated. I audited it all and made sense of it: where each document comes from, where it should live, how it connects to the rest, and who needs to find it. Members and staff. Journalists, the check and balance on politics. And the public. Then I redesigned the information architecture so each of them could. It was a proposal for the provider that ran that system.']},
   {id:'out',h:'Outcome',p:['I tested the information architecture with two Treejack tests on Maze in August and September 2022, with 40 external testers and 97 Parliament staff. External testers got 87% of the tasks right on average, and staff 89%. That’s the number that counts: one structure had to work for both audiences, and it did. The Speaker and the President, who lead the two houses, both approved the final design concept, which apparently doesn’t happen often. My job was to design it and test it. Building it was someone else’s, as it often is. Parliament has since launched a new site, and its main menu includes “Members and electorates”, the label the tree test suggested.']}],
  notes:['Parliament of NSW, Communications, Engagement and Education Strategy, December 2020.',
   'ACARA, NAP–Civics and Citizenship 2019 (published 2021): Year 10 students across Australia at or above the proficient standard. These were the latest results in 2022.',
   'Legislative Council Strategic Plan 2022–2023, which plans a website redesign to “showcase engaging, accessible, comprehensible content”.',
   'Multicultural NSW (NSW Government): “one of the most culturally diverse states in the world”.',
   'A rough estimate for 2021–22. The Legislative Council’s committees took in 7,521 submissions, and its members lodged 2,351 written questions (Legislative Council Annual Report 2021–22). The Legislative Assembly lodged more than 1,000 written questions a year, going by its question numbers from November 2021 to June 2022. That’s already nearly 11,000, before Hansard, minutes, tabled papers and the Assembly’s committees. The records start in 1824, when the Legislative Council first met.',
   'StatCounter Global Stats, October 2026: 59.9% of web traffic worldwide came from mobile phones, against 38.5% from desktops.']},
 {id:'rsl',side:true,logo:'logos/rsl.webp',name:'RSL Queensland Lottery',accent:'#C6D2C1',photo:'cards/rsl.jpg',photos:[['photos/rsl-home.jpg','A prize home'],['photos/rsl-balcony.jpg','A prize home balcony'],['photos/rsl-medals.jpg','Veterans’ medals']],
  short:'A dream home lottery, built to sell on a phone.',who:'Host/Havas · UX Director · 2022',res:'“Smart CTA is a winner” (218 testers)',
  title:'RSL Queensland Lottery: a dream home lottery, built to sell on a phone',
  kick:'For RSL Queensland, at Host/Havas · UX Director · Strategy, UX and UI design up to the build · 2022',
  sections:[
   {id:'problem',h:'Problem',pic:'Loyal buyers and dream buyers',p:['Lotteries are big business in Australia. After prizes, Australians spend over $3 billion a year on them.<sup>1</sup> RSL Queensland runs the country’s biggest prize home lottery,<sup>2</sup> and it’s the main way it pays for its work with veterans and their families. But the buyers were changing. The loyal ones, many of whom bought for the cause, were getting older. Newer buyers came for the dream home, and to them it could become just another game. Then there’s the phone. Over half the site’s traffic came from mobile, and mobile converted below desktop. Closing that gap was worth about $1.2 million a year.<sup>3</sup> The best customers were the VIPs, who subscribe. But the offer was hard to understand, and pausing it took a phone call. So the site had to make a complicated lottery simple, on a small screen.']},
   {id:'solution',h:'Solution',pic:'The Smart CTA',p:['The idea: let the checkout come to you. Tap buy, and the checkout opens on top of the page, so nobody leaves the dream home they’re looking at. We called it the Smart CTA. That’s where the hard decisions live: how many tickets, which bonus, one draw or a subscription, and how to pay. Each had to feel obvious on a phone, with Apple Pay, Google Pay and PayPal a tap away. Subscription comes first, because the lottery would now sell itself as a subscription, with single tickets on the side. Users told us the catch: “Yes please, as long as it’s easy to pause.” So the member area works like an app. Members pause and manage it all themselves. No phone call.']},
   {id:'role',h:'My role',intro:'I led the strategy and the experience, from the first workshops to the final prototype test.',items:[
    ['Research:','stakeholder workshops and interviews at RSL Queensland.','Workshops'],
    ['Segmentation and personas:','built from first- and third-party data, then shaped by customer interviews into five personas.','Five personas'],
    ['Baseline:','site analytics, heatmaps and a survey of 2,000 customers. It pointed to three problems: the first purchase, the upgrade to subscription, and keeping members.','Baseline and survey'],
    ['Information architecture','and navigation, mobile first.','Navigation'],
    ['UX concept and wireframes:','the Smart CTA, the checkout and the member area, tested with users in rounds as they took shape. The checkout was the hardest part: a lot of decisions on a small screen.','Checkout wireframes'],
    ['Experience direction:','our UI designer at Havas made three UI concepts, then took the chosen one into detail. Together we kept it simple and on brand.','UI concepts']]},
   {id:'out',h:'Outcome',p:['I tested the final prototype on Maze in June 2022, with 218 random testers. The verdict: “Smart CTA is a winner.” The new member page worked well too, and the checkout follows the conventions people already know. That’s what counts. The checkout is where the buying happens, and it had to work on a phone. My job ended where the build began. RSL’s own developers built it from there.']}],
  notes:['Australian Institute of Health and Welfare, Gambling in Australia, using Queensland Government Statistician’s Office, Australian Gambling Statistics (2024): $3.11 billion in net losses on lotteries (lotto, pools and instant scratch tickets) in 2022–23, in 2022–23 dollars.',
   'Dream Home Art Union (called RSL Art Union until October 2024), “Our history”: “Australia’s largest prize home lottery”.',
   'RSL Queensland’s site data for 2021, from the project’s business case: over 50% of traffic from mobile, close to 60% with tablets.']},
 {id:'afp',side:true,logo:'logos/afp.webp',name:'Australian Federal Police',accent:'#B9A7E0',photo:'cards/afp.jpg',photos:[['photos/afp-building.jpg','The Edmund Barton Building, AFP headquarters in Canberra'],['photos/afp-room.jpg','A workshop with the AFP'],['photos/afp-boards.jpg','Workshop boards']],
  short:'A careers site, built to recruit a more diverse force.',who:'Host/Havas · UX Director · 2021',res:'300+ pages down to under 100, WCAG AA',
  title:'Australian Federal Police: a careers site, built to recruit a more diverse force',
  kick:'For the Australian Federal Police, at Host/Havas · UX Director · UX strategy, research, information architecture and experience direction · Launched March 2021',
  sections:[
   {id:'problem',h:'Problem',pic:'Everyone’s doubts, and each audience’s own',p:['The Australian Federal Police takes on the country’s most serious crime, from terrorism to cybercrime. To do it well, it needs to look like the country it protects. In 2021, only 22% of its sworn officers were women.<sup>1</sup> So it set out to recruit more women, First Nations and culturally diverse Australians. But the research turned up a bigger problem: most people didn’t know what the AFP is or does. Everyone had the same doubts: the pay, the danger, the move to Canberra. Then each audience had its own. Women asked if a male-dominated job leaves room for family. First Nations Australians needed to feel culturally safe. Culturally diverse Australians had parents to convince that it’s a good career. And the old site did the brand no favours. So the new one had to explain the AFP first, then answer each doubt.']},
   {id:'solution',h:'Solution',pic:'A careers hub built around the doubts',p:['The research also showed the way in. People warmed to the AFP once they saw it takes on the most serious, complex crime, and that the work takes more brains than they thought. Our creative strategy team turned that into the brand, A Step Ahead. So the site had to be a step ahead too. My part was the experience: a careers hub built around the doubts, where each audience finds its own questions answered, from family to cultural safety. Some doubts lived at home, so the site explains the process and why it’s a good career, for recruits to share with family and friends. With audiences this diverse, accessibility came first, in the content and the interface, to WCAG AA. Other Havas teams rewrote the content, from 300+ pages of jargon to under 100 that are easy to scan.']},
   {id:'role',h:'My role',intro:'I led the UX strategy and the experience, from the first workshops to the final designs.',items:[
    ['Workshops and user interviews:','a first workshop with the AFP in Canberra, mapping the recruitment journey and its barriers. Then interviews with the people the AFP wanted to reach.','Journey and barriers workshop'],
    ['UX strategy:','a careers hub, built to answer what holds each audience back.','UX strategy'],
    ['Personas and journeys:','six personas, and a journey for each from first look to recruitment.','Six personas'],
    ['Information architecture and navigation:','what the AFP needed, laid over the user journeys, then a Treejack test to confirm the structure.','Sitemap and tree test'],
    ['Content mapping:','templates and content maps first, so every page type had its content before it had a layout.','Content maps'],
    ['Wireframes and testing:','detailed wireframes of the core components and page types, mobile and desktop side by side.','Wireframes'],
    ['Experience direction:','our interface design team made the final designs, other Havas teams wrote the content, and the creative strategy team led the brand. Together we kept it accessible and on brand.','Final designs']]},
   {id:'out',h:'Outcome',p:['The Treejack test confirmed the information architecture, and the careers hub launched in early March 2021. The AFP’s verdict: “As a result of the comprehensive research undertaken, the AFP have a way forward in the effort to increase diversity in the organisation.” That’s Emma Hardy, Taskforce Horizon, People and Culture Command. That’s the part that counts. The job was never just a website. It was a step toward a more diverse AFP.']}],
  notes:['Australian Federal Police, media release, 7 May 2021: sworn women (police and protective service officers) made up 22% of the AFP, against a new target of 30% by 2028.']},
 {id:'unsw',side:true,logo:'logos/unsw.webp',name:'UNSW',accent:'#F4E35A',photo:'cards/unsw.jpg',photos:[['photos/unsw-nobel.jpg','UNSW, Kensington'],['boards/unsw/workshop-wall.jpg','A workshop with UNSW'],['boards/unsw/workshop-sketch.jpg','Sketching the pages together']],
  short:'Over 250 websites, turned into one.',who:'Re · UX Director · 2020',res:'Tree test: 417 people, 2,787 tasks',
  title:'UNSW: over 250 websites, turned into one',
  kick:'For UNSW, at Re · UX Director · Research, information architecture, page models and testing · Jan to Jun 2020',
  sections:[
   {id:'problem',h:'Problem',pic:'A Frankenstein of 250+ websites',p:['Education is one of Australia’s biggest exports, worth $40 billion in 2019.<sup>1</sup> Every university is chasing its share, and the race is global. For UNSW, it’s business critical. Most of its revenue comes from overseas students and partnerships, so the website has to work. But UNSW’s web had grown into a Frankenstein of over 250 websites. Every centre, institute and group ran its own, on more than 20 CMSs. Old projects stayed online, and nobody updated them. Most sites weren’t mobile first. The same degree could sit on several sites, run by different teams. The brand was strong, and plenty of people came. But once they arrived, they got lost. The job was to turn over 250 websites into one: user and mobile first, accessible, and built to bring in new students.']},
   {id:'solution',h:'Solution',pic:'Three student mindsets',p:['The north star was one website, one experience. The research showed the way in. UNSW has many audiences, but they differed far less than anyone expected. So a menu by audience made little sense, and asking “who are you?” only added a step. Instead, the menu follows what people came to do, not who they are. A pile of personas became three student mindsets. Focused students know what they want, so they get search and quick links. Exploring students like to browse, so they get a big, open menu. Uncertain students need a reason, so the homepage tells the stories of UNSW’s people.']},
   {id:'role',h:'My role',intro:'I led the UX at Re, from the information architecture to the wireframes, and shared the strategy and the workshops with the team.',items:[
    ['Strategy and workshops','with the Re team, from the north star with UNSW’s leaders to the working groups.','North star workshop'],
    ['Research and mindsets:','interviews with UNSW’s CX team, building on earlier persona research by Deloitte.','Mindsets'],
    ['Information architecture:','four navigation models compared, and the best one tested.','Four navigation models'],
    ['Sitemap and content mapping:','Study, Research, Engage, About. Flat for mobile, with pillar pages search can find.','Sitemap'],
    ['Page models and wireframes','for every kind of page. The hard part: with a flat structure, a lot of content sits on each page.','Page models'],
    ['Front-door concepts','with the Re team: three ideas for the homepage. AKQA ran a parallel performance stream.','Three front doors']]},
   {id:'stake',h:'Stakeholder management deluxe',pic:'Three rounds of workshops',p:['One website meant every part of the university needed a say. A very democratic setup. UNSW was split into three groups, with two or three people from each faculty and division. We ran the same workshop three times over two weeks. In between, we analysed the results, built a playback and ran the next round. Stakeholder management was next level. Halfway through, COVID moved the workshops online, which was a godsend. Boards were easier to prepare and run. People could fill them in after the meeting, and nothing had to move from paper stickies onto a board, so we got time back. Pretty full on for a couple of months.']},
   {id:'out',h:'Outcome',p:['I tested the menu with a Treejack test in April 2020: 417 people and 2,787 tasks. First-click success was 58% for people outside UNSW and 72% for people inside it. Fewer than one in ten final comments mentioned trouble finding their way. That’s the number that counts. One menu had to work for everyone, without asking who they are, and it held up. In September 2020, UNSW opened its new front door, built by UNSW and its partners. The new Future Students page came first: traffic up as much as 50% in its first week, and search rankings stable within two weeks.<sup>2</sup>']}],
  notes:['Reserve Bank of Australia, Bulletin, December 2020, “The COVID-19 Outbreak and Australia’s Education and Tourism Exports”: education exports totalled $40 billion in 2019, Australia’s fourth-largest export before the pandemic.',
   'UNSW, Inside UNSW, 7 September 2020, “Knock knock, it’s our new front door”. The homepage went live on 8 September 2020.']}];

   return `<figure class="bc" style="width:${(h*ar[i]).toFixed(1)}px;transform:rotate(${r}deg)"><img src="${path(f)}${ext(f)}" alt="${f.split('/').pop().replace(/-/g,' ')} board" decoding="async" width="${SZ[f][0]}" height="${SZ[f][1]}"></figure>`}).join('')+`</div>`}).join('')+(link?`<p class="blink"><a href="${link[0]}" target="_blank" rel="noopener">${link[1]} ↗</a></p>`:`<p class="bnote">Zoom in to read the boards. Names and contact details have been removed.</p>`)+`</div>`}
function miniBoard(k,cap){const WB=C_CASE&&WALLS_BY[C_CASE.id];if(WB&&!WB[k])return '';if(WB&&WB[k])return boardWall(WB[k],phone()?600:640,18,(LINKS_BY[C_CASE.id]||{})[k]);  // the full width of the role column, out to the lineslet h='',seed=k*7+3;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
